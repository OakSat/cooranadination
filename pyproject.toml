[project]
name = "freight"
version = "0.1.0"
description = "AI freight coordination: LLM for language, deterministic code for correctness"
requires-python = ">=3.12"
dependencies = [
    "anthropic[bedrock]>=1.13.0",
    "aws-lambda-powertools>=3.35.0",
    "boto3>=1.43.112",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "pydantic>=2.7",
    "pypdf>=6.20.1",
    "tenacity>=9.2.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "moto[dynamodb,events,s3,ses,sqs,ssm,stepfunctions]>=5.2.4",
    "boto3-stubs[bedrock,budgets,cloudformation,dynamodb,events,s3,ses,sqs,ssm,stepfunctions,sts]>=1.43.112",
    "types-openpyxl>=3.1.5.20260827",
]
infra = [
    "aws-cdk-lib>=2.273.0",
    "cdk-nag>=2.37,<3",
    "constructs>=10.8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["infra/build", "infra/cdk.out"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.uv]
default-groups = ["dev", "infra"]
